<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventario de Aislación</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inventario">
<meta name="theme-color" content="#0e6b5c">
<style>
@font-face{font-family:"Inter";font-weight:400;font-display:swap;src:url("../fonts/inter-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Inter";font-weight:500;font-display:swap;src:url("../fonts/inter-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Inter";font-weight:600;font-display:swap;src:url("../fonts/inter-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:500;font-display:swap;src:url("../fonts/barlow-condensed-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url("../fonts/barlow-condensed-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url("../fonts/barlow-condensed-latin-700-normal.woff2") format("woff2")}
/* Layout: one-column yard tool — trailer + side pickers, stock rows with +/− , totals and history tabs */
:root{
  --bg:#eef3f1; --surface:#ffffff; --fg:#14211d; --muted:#5b6b66; --line:#d2dcd8;
  --accent:#0e6b5c; --accent-fg:#ffffff; --accent-soft:#d6ebe5;
  --minus:#b42318; --minus-soft:#fde4e1; --plus:#0e6b5c; --plus-soft:#d6ebe5;
  --warn-soft:#fde7c7; --warn-fg:#7a4a00;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1513; --surface:#17211e; --fg:#e6eeeb; --muted:#97a8a2; --line:#2a3833;
  --accent:#4cc3a6; --accent-fg:#06201a; --accent-soft:#173a32;
  --minus:#ff8a7e; --minus-soft:#3d1a17; --plus:#4cc3a6; --plus-soft:#173a32;
  --warn-soft:#4a3410; --warn-fg:#ffd79a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1513; --surface:#17211e; --fg:#e6eeeb; --muted:#97a8a2; --line:#2a3833;
  --accent:#4cc3a6; --accent-fg:#06201a; --accent-soft:#173a32;
  --minus:#ff8a7e; --minus-soft:#3d1a17; --plus:#4cc3a6; --plus-soft:#173a32;
  --warn-soft:#4a3410; --warn-fg:#ffd79a; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font:700 1.8rem/1 var(--display);text-transform:uppercase;letter-spacing:.01em;margin:0}
.who{font:500 .85rem var(--body);color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:5px 10px;cursor:pointer}
.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.tabs button{flex:1;font:600 .92rem var(--body);border:0;background:transparent;color:var(--muted);padding:9px 8px;border-radius:8px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg)}
.banner{border-radius:10px;padding:10px 12px;font-size:.88rem;background:var(--warn-soft);color:var(--warn-fg)}
.label{font:600 .95rem var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:700 1.15rem var(--display);min-height:44px;min-width:56px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;cursor:pointer;padding:4px 12px}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chips button.add{font:600 .95rem var(--body);color:var(--accent);border-style:dashed}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{font:700 1.05rem var(--display);text-transform:uppercase;letter-spacing:.04em;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:9px 6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.seg small{font:500 .8rem var(--body);opacity:.8;margin-left:4px;text-transform:none;letter-spacing:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px 10px 8px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.med{font:700 1.3rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.med .let{font:600 .8rem var(--body);color:var(--muted);margin-left:6px;vertical-align:middle}
.ctl{display:flex;align-items:center;gap:6px}
.ctl button.m,.ctl button.p{width:44px;height:44px;border-radius:10px;border:0;font:700 1.5rem/1 var(--display);cursor:pointer}
.ctl button.m{background:var(--minus-soft);color:var(--minus)}
.ctl button.p{background:var(--plus-soft);color:var(--plus)}
.ctl button.m:disabled{opacity:.35;cursor:not-allowed}
.qty{min-width:58px;text-align:center;font:700 1.6rem/1 var(--display);font-variant-numeric:tabular-nums;background:none;border:1px solid transparent;color:var(--fg);border-radius:8px;padding:6px 4px;cursor:pointer}
.qty.zero{color:var(--muted)}
.edit{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:4px 0 6px}
input[type=number],input[type=text],input[type=search],select{font:600 1.15rem var(--display);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);min-width:0}
.edit input{width:110px}
.btn{font:600 .95rem var(--body);border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);border-radius:8px;padding:9px 14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:transparent;color:var(--minus);border-color:var(--minus)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{font:700 1.05rem var(--display);text-transform:uppercase;letter-spacing:.05em;margin:0}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form label{display:flex;flex-direction:column;gap:4px;font:600 .8rem var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.form .full{grid-column:1/-1}
.empty{padding:18px 14px;color:var(--muted)}
.sum{display:flex;justify-content:space-between;align-items:baseline;color:var(--muted);font-size:.9rem}
.sum b{font:700 1.2rem var(--display);color:var(--fg)}
.tot .row{grid-template-columns:minmax(0,1fr) auto}
.tot .where{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.big{font:700 1.6rem/1 var(--display);font-variant-numeric:tabular-nums}
.mov{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.mov:last-child{border-bottom:0}
.d{font:700 1.3rem var(--display);min-width:48px;text-align:right;grid-row:span 2;align-self:center;font-variant-numeric:tabular-nums}
.d.neg{color:var(--minus)} .d.pos{color:var(--plus)}
.mov .t1{font:600 1.05rem var(--display)}
.mov .t2{font-size:.82rem;color:var(--muted)}
.status{font-size:.8rem;color:var(--muted)}
.status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--plus);margin-right:5px;vertical-align:middle}
.status.off .dot{background:var(--minus)}
.note{font-size:.85rem;color:var(--muted);margin:0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Inventario</h1>
    <button class="who" id="who" type="button">Usuario: —</button>
  </header>
  <div class="status" id="status"><span class="dot"></span>Conectando…</div>
  <div class="banner" id="banner" hidden></div>

  <form class="card" id="name-card" hidden>
    <h3>¿Quién está usando la app?</h3>
    <p class="note">Su nombre aparece en el historial junto a cada cambio.</p>
    <input type="text" id="name-input" placeholder="Su nombre" autocomplete="name" maxlength="30">
    <button class="btn" type="submit">Guardar</button>
  </form>

  <div class="tabs" role="tablist">
    <button id="tab-trailer" role="tab" aria-selected="true">Tráileres</button>
    <button id="tab-totales" role="tab" aria-selected="false">Totales</button>
    <button id="tab-historial" role="tab" aria-selected="false">Historial</button>
  </div>

  <main id="view-trailer" style="display:flex;flex-direction:column;gap:14px">
    <section>
      <p class="label">Tráiler</p>
      <div class="chips" id="trailers"></div>
    </section>
    <div class="seg" id="sides"></div>
    <div class="sum" id="sum"></div>
    <div class="list" id="items"></div>
    <form class="card" id="add-form">
      <h3>Agregar medida</h3>
      <div class="form">
        <label>Pipa<select id="add-pipa"></select></label>
        <label>Espesor<select id="add-esp"></select></label>
        <label class="full">Cantidad<input type="number" id="add-qty" inputmode="numeric" min="0" step="1" value="1"></label>
      </div>
      <button class="btn" type="submit">Agregar al tráiler</button>
      <p class="note" id="add-msg"></p>
    </form>
    <div class="card" id="seed-card" hidden>
      <h3>Inventario vacío</h3>
      <p class="note">Puede cargar los conteos del cuaderno (tráileres 8, 9, 10 y 11) para empezar.</p>
      <button class="btn" id="seed-btn" type="button">Cargar datos del cuaderno</button>
    </div>
  </main>

  <main id="view-totales" hidden style="flex-direction:column;gap:12px">
    <input type="search" id="q" placeholder="Buscar medida, ej. 12x2" aria-label="Buscar medida" autocomplete="off">
    <div class="sum" id="tot-sum"></div>
    <div class="list tot" id="totales"></div>
  </main>

  <main id="view-historial" hidden style="flex-direction:column;gap:12px">
    <p class="note">Últimos movimientos de todo el equipo.</p>
    <div class="list" id="movs"></div>
  </main>
</div>

  } catch (e) {
    console.error(e);
    $('#banner').hidden = false;
    $('#banner').textContent = 'No se pudo conectar con la base de datos. Revise su internet y vuelva a abrir la app.';
  }
}
if (!store) {
  // test mode: this phone only
  const subs = { items: [], movs: [] };
  const load = () => ({ items: ls.get('inv-items', {}), movs: ls.get('inv-movs', []) });
  const emit = () => { const d = load(); subs.items.forEach(cb => cb(Object.entries(d.items).map(([id, v]) => ({ id, ...v })), { fromCache: false, hasPendingWrites: false })); subs.movs.forEach(cb => cb(d.movs.slice(0, 200))); };
  store = {
    mode: 'local',
    onItems(cb){ subs.items.push(cb); setTimeout(emit, 0); },
    onMovs(cb){ subs.movs.push(cb); setTimeout(emit, 0); },
    write(changes, mov){
      const d = load();
      for (const c of changes) {
        if (c.del) { delete d.items[c.id]; continue; }
        const prev = d.items[c.id] || { trailer: c.trailer, lado: c.lado, pipa: c.pipa, esp: c.esp, qty: 0 };
        prev.qty = c.set !== undefined ? c.set : prev.qty + c.delta;
        d.items[c.id] = prev;
      }
      if (mov) d.movs.unshift({ id: String(Date.now()), ...mov, t: { toMillis: null, ms: Date.now() } });
      ls.set('inv-items', d.items); ls.set('inv-movs', d.movs.slice(0, 500)); emit();
      return Promise.resolve();
    }
  };
  if (!$('#banner').textContent) {
    $('#banner').hidden = false;
    $('#banner').textContent = 'Modo prueba: falta conectar la base de datos. Los cambios se guardan solo en este teléfono.';
  }
}

// ---------------- state ----------------
let ITEMS = [], MOVS = [];
let st = Object.assign({ trailer: null, lado: 'L', view: 'trailer', editing: null, q: '' }, ls.get('inv-st', {}));
st.editing = null;
let quien = ls.get('inv-name', '');
const save = () => ls.set('inv-st', { trailer: st.trailer, lado: st.lado, view: st.view });

function renderWho(){
  $('#who').textContent = 'Usuario: ' + (quien || '—');
  $('#name-card').hidden = !!quien;
}
$('#who').onclick = () => { $('#name-card').hidden = false; $('#name-input').value = quien; $('#name-input').focus(); };
$('#name-card').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('#name-input').value.trim();
  if (!v) { $('#name-input').focus(); return; }
  quien = v; ls.set('inv-name', v); renderWho();
});

function requireName(){
  if (quien) return true;
  $('#name-card').hidden = false; $('#name-input').focus();
  $('#name-card').scrollIntoView({ block: 'center' });
  return false;
}

// ---------------- actions ----------------
function change(it, delta){
  if (!requireName()) return;
  if (it.qty + delta < 0) return;
  store.write([{ id: it.id, trailer: it.trailer, lado: it.lado, pipa: it.pipa, esp: it.esp, delta }],
    { trailer: it.trailer, lado: it.lado, pipa: it.pipa, esp: it.esp, delta, antes: it.qty, despues: it.qty + delta, quien })
    .catch(err => showError(err));
}
function setQty(it, n){
  if (!requireName()) return;
  if (!(n >= 0) || n === it.qty) { st.editing = null; render(); return; }
  store.write([{ id: it.id, trailer: it.trailer, lado: it.lado, pipa: it.pipa, esp: it.esp, set: n }],
    { trailer: it.trailer, lado: it.lado, pipa: it.pipa, esp: it.esp, delta: n - it.qty, antes: it.qty, despues: n, quien, tipo: 'conteo' })
    .catch(err => showError(err));
  st.editing = null; render();
}
function removeItem(it){
  if (!requireName()) return;
  store.write([{ id: it.id, del: true }],
    { trailer: it.trailer, lado: it.lado, pipa: it.pipa, esp: it.esp, delta: -it.qty, antes: it.qty, despues: 0, quien, tipo: 'quitar' })
    .catch(err => showError(err));
  st.editing = null; render();
}
function showError(err){
  console.error(err);
  $('#banner').hidden = false;
  $('#banner').textContent = 'No se guardó el último cambio (' + (err && err.code || 'error') + '). Revise la conexión y vuelva a intentarlo.';
}

// ---------------- render ----------------
const trailersList = () => {
  const set = new Set(ITEMS.map(i => String(i.trailer)));
  (ls.get('inv-extra-trailers', [])).forEach(t => set.add(String(t)));
  return [...set].sort((a, b) => (parseFloat(a) - parseFloat(b)) || a.localeCompare(b));
};
const sortItems = arr => arr.sort((a, b) => (num(a.pipa) - num(b.pipa)) || (num(a.esp) - num(b.esp)));

function renderTrailer(){
  const ts = trailersList();
  if (!st.trailer || !ts.includes(String(st.trailer))) st.trailer = ts[0] || null;
  const tc = $('#trailers'); tc.innerHTML = '';
  ts.forEach(t => {
    const b = document.createElement('button'); b.type = 'button'; b.id = 'tr-' + t;
    b.textContent = t; b.setAttribute('aria-pressed', String(t) === String(st.trailer));
    b.onclick = () => { st.trailer = t; st.editing = null; save(); render(); };
    tc.appendChild(b);
  });
  const add = document.createElement('button'); add.type = 'button'; add.className = 'add'; add.id = 'tr-add';
  add.textContent = '+ Tráiler';
  add.onclick = () => {
    if (add.dataset.open) return;
    add.dataset.open = '1';
    add.innerHTML = '<input type="text" id="new-trailer" inputmode="numeric" placeholder="Núm." style="width:80px;font-size:1rem;padding:4px 6px">';
    const inp = $('#new-trailer'); inp.focus();
    const done = () => {
      const v = inp.value.trim();
      if (v) { const ex = ls.get('inv-extra-trailers', []); if (!ex.includes(v)) ex.push(v); ls.set('inv-extra-trailers', ex); st.trailer = v; save(); }
      render();
    };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') done(); if (e.key === 'Escape') render(); });
    inp.addEventListener('blur', done);
  };
  tc.appendChild(add);

  const inTrailer = ITEMS.filter(i => String(i.trailer) === String(st.trailer));
  const sc = $('#sides'); sc.innerHTML = '';
  ['L', 'R'].forEach(l => {
    const n = inTrailer.filter(i => i.lado === l).reduce((t, i) => t + (i.qty || 0), 0);
    const b = document.createElement('button'); b.type = 'button'; b.id = 'side-' + l;
    b.innerHTML = `${SIDES[l]} <small>${l === 'L' ? 'Left' : 'Right'} · ${n}</small>`;
    b.setAttribute('aria-pressed', st.lado === l);
    b.onclick = () => { st.lado = l; st.editing = null; save(); render(); };
    sc.appendChild(b);
  });

  const list = sortItems(inTrailer.filter(i => i.lado === st.lado));
  const total = list.reduce((t, i) => t + (i.qty || 0), 0);
  $('#sum').innerHTML = st.trailer ? `<span>Tráiler ${esc(st.trailer)} · ${SIDES[st.lado]} · ${list.length} medidas</span><span><b>${total}</b> piezas</span>` : '';
  const box = $('#items');
  if (!st.trailer) box.innerHTML = '<div class="empty">Todavía no hay tráileres. Agregue uno con “+ Tráiler”.</div>';
  else if (!list.length) box.innerHTML = '<div class="empty">No hay medidas en este lado. Agréguelas abajo.</div>';
  else box.innerHTML = list.map(it => {
    const L = window.LETRAS[`${it.pipa}x${it.esp}`];
    const ed = st.editing === it.id;
    return `<div class="row" data-id="${esc(it.id)}">
      <div class="med">${esc(medida(it))}${L ? `<span class="let">${L}</span>` : ''}</div>
      <div class="ctl">
        <button class="m" type="button" data-act="minus" aria-label="Restar 1" ${it.qty > 0 ? '' : 'disabled'}>−</button>
        <button class="qty ${it.qty ? '' : 'zero'}" type="button" data-act="edit" aria-label="Cambiar cantidad">${it.qty}</button>
        <button class="p" type="button" data-act="plus" aria-label="Sumar 1">+</button>
      </div>
      ${ed ? `<div class="edit">
        <input type="number" inputmode="numeric" min="0" step="1" value="${it.qty}" id="edit-qty" aria-label="Cantidad contada">
        <button class="btn" type="button" data-act="set">Guardar conteo</button>
        <button class="btn ghost" type="button" data-act="cancel">Cancelar</button>
        <button class="btn danger" type="button" data-act="del">Quitar medida</button>
      </div>` : ''}
    </div>`;
  }).join('');
  if (st.editing) { const e = $('#edit-qty'); if (e) { e.focus(); e.select(); } }
  $('#seed-card').hidden = ITEMS.length > 0 || !loaded;
}

$('#items').addEventListener('click', ev => {
  const b = ev.target.closest('button[data-act]'); if (!b) return;
  const id = b.closest('.row').dataset.id; const it = ITEMS.find(i => i.id === id); if (!it) return;
  const a = b.dataset.act;
  if (a === 'minus') change(it, -1);
  else if (a === 'plus') change(it, +1);
  else if (a === 'edit') { st.editing = st.editing === id ? null : id; render(); }
  else if (a === 'cancel') { st.editing = null; render(); }
  else if (a === 'set') setQty(it, Math.floor(Number($('#edit-qty').value)));
  else if (a === 'del') {
    if (b.dataset.confirm) removeItem(it);
    else { b.dataset.confirm = '1'; b.textContent = 'Toque otra vez para quitar'; }
  }
});
$('#items').addEventListener('keydown', ev => {
  if (ev.target.id === 'edit-qty' && ev.key === 'Enter') {
    const it = ITEMS.find(i => i.id === st.editing); if (it) setQty(it, Math.floor(Number(ev.target.value)));
  }
});

// add form
const fillSel = (sel, arr, def) => { sel.innerHTML = arr.map(v => `<option value="${v}">${v}"</option>`).join(''); sel.value = def; };
fillSel($('#add-pipa'), PIPAS, '2'); fillSel($('#add-esp'), ESP, '2');
$('#add-form').addEventListener('submit', e => {
  e.preventDefault();
  if (!requireName()) return;
  if (!st.trailer) { $('#add-msg').textContent = 'Primero agregue un tráiler con “+ Tráiler”.'; return; }
  const pipa = $('#add-pipa').value, esp = $('#add-esp').value, q = Math.floor(Number($('#add-qty').value));
  if (!(q >= 0)) { $('#add-msg').textContent = 'Escriba una cantidad válida.'; return; }
  const id = docId(st.trailer, st.lado, pipa, esp);
  const ex = ITEMS.find(i => i.id === id);
  const antes = ex ? ex.qty : 0;
  store.write([{ id, trailer: String(st.trailer), lado: st.lado, pipa, esp, delta: q }],
    { trailer: String(st.trailer), lado: st.lado, pipa, esp, delta: q, antes, despues: antes + q, quien, tipo: ex ? 'entrada' : 'nueva' })
    .catch(err => showError(err));
  $('#add-msg').textContent = `${ex ? 'Sumadas' : 'Agregadas'} ${q} piezas de ${pipa} x ${esp} al tráiler ${st.trailer} (${SIDES[st.lado].toLowerCase()}).`;
  $('#add-qty').value = 1;
});

// seed
$('#seed-btn').onclick = () => {
  if (!requireName()) return;
  const changes = window.SEED.map(([t, l, p, e, q]) => ({ id: docId(t, l, p, e), trailer: t, lado: l, pipa: p, esp: e, set: q }));
  store.write(changes, { trailer: '—', lado: '', pipa: '', esp: '', delta: changes.reduce((s, c) => s + c.set, 0), antes: 0, despues: 0, quien, tipo: 'carga' })
    .catch(err => showError(err));
};

function renderTotales(){
  const q = st.q.toLowerCase().replace(/\s+/g, '');
  const g = new Map();
  ITEMS.forEach(i => {
    const k = `${i.pipa}x${i.esp}`;
    if (!g.has(k)) g.set(k, { pipa: i.pipa, esp: i.esp, total: 0, where: [] });
    const o = g.get(k); o.total += i.qty || 0;
    if (i.qty) o.where.push(`T${i.trailer} ${i.lado === 'L' ? 'Izq' : 'Der'}: ${i.qty}`);
  });
  let arr = [...g.values()];
  if (q) arr = arr.filter(o => `${o.pipa}x${o.esp}`.replace(/\s+/g, '').toLowerCase().includes(q));
  sortItems(arr);
  const tot = arr.reduce((s, o) => s + o.total, 0);
  $('#tot-sum').innerHTML = `<span>${arr.length} medidas${q ? ' encontradas' : ''}</span><span><b>${tot}</b> piezas</span>`;
  $('#totales').innerHTML = arr.length ? arr.map(o => {
    const L = window.LETRAS[`${o.pipa}x${o.esp}`];
    return `<div class="row"><div class="med">${esc(o.pipa)} x ${esc(o.esp)}${L ? `<span class="let">${L}</span>` : ''}</div>
      <div class="big">${o.total}</div>
      <div class="where">${o.where.length ? o.where.map(esc).join('<span aria-hidden="true">·</span>') : 'Sin piezas'}</div></div>`;
  }).join('') : `<div class="empty">${q ? 'No hay ninguna medida que coincida.' : 'Todavía no hay inventario.'}</div>`;
}
$('#q').addEventListener('input', e => { st.q = e.target.value; renderTotales(); });

const ago = ms => {
  if (!ms) return 'ahora';
  const s = (Date.now() - ms) / 1000;
  if (s < 60) return 'hace un momento';
  if (s < 3600) return `hace ${Math.round(s / 60)} min`;
  if (s < 86400) return `hace ${Math.round(s / 3600)} h`;
  return new Date(ms).toLocaleString('es', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
};
function renderMovs(){
  $('#movs').innerHTML = MOVS.length ? MOVS.map(m => {
    const ms = m.t && (m.t.toMillis ? m.t.toMillis() : m.t.ms);
    if (m.tipo === 'carga') return `<div class="mov"><div class="d pos">+${m.delta}</div><div class="t1">Carga inicial del cuaderno</div><div class="t2">${esc(m.quien || '')} · ${ago(ms)}</div></div>`;
    const d = m.delta || 0;
    const what = m.tipo === 'conteo' ? 'Conteo' : m.tipo === 'quitar' ? 'Medida quitada' : m.tipo === 'nueva' ? 'Medida nueva' : d < 0 ? 'Salida' : 'Entrada';
    return `<div class="mov"><div class="d ${d < 0 ? 'neg' : 'pos'}">${d > 0 ? '+' : ''}${d}</div>
      <div class="t1">${esc(m.pipa)} x ${esc(m.esp)} · T${esc(m.trailer)} ${m.lado === 'L' ? 'Izq' : 'Der'}</div>
      <div class="t2">${what} · ${m.antes} → ${m.despues} · ${esc(m.quien || '')} · ${ago(ms)}</div></div>`;
  }).join('') : '<div class="empty">Todavía no hay movimientos.</div>';
}

function render(){ renderWho(); renderTrailer(); renderTotales(); renderMovs(); }

const VIEWS = ['trailer', 'totales', 'historial'];
function show(v){
  st.view = v; save();
  VIEWS.forEach(k => { const el = $('#view-' + k); el.hidden = k !== v; el.style.display = k === v ? 'flex' : 'none'; $('#tab-' + k).setAttribute('aria-selected', k === v); });
}
VIEWS.forEach(k => { $('#tab-' + k).onclick = () => show(k); });

// ---------------- boot ----------------
let loaded = false;
const setStatus = (meta) => {
  const el = $('#status');
  if (store.mode === 'local') { el.className = 'status off'; el.innerHTML = '<span class="dot"></span>Solo en este teléfono'; return; }
  const off = !navigator.onLine || (meta && meta.fromCache);
  el.className = 'status' + (off ? ' off' : '');
  el.innerHTML = '<span class="dot"></span>' + (off ? 'Sin conexión · los cambios se envían al volver la señal' : (meta && meta.hasPendingWrites ? 'Enviando cambios…' : 'Conectado · datos compartidos'));
};
const timer = setTimeout(() => { if (!loaded) { $('#status').className = 'status off'; $('#status').innerHTML = '<span class="dot"></span>Tardando en cargar… revise su internet'; } }, 10000);
store.onItems((items, meta) => { loaded = true; clearTimeout(timer); ITEMS = items; setStatus(meta); render(); }, err => showError(err));
store.onMovs(m => { MOVS = m; renderMovs(); }, err => console.error(err));
window.addEventListener('online', () => setStatus()); window.addEventListener('offline', () => setStatus({ fromCache: true }));
show(VIEWS.includes(st.view) ? st.view : 'trailer');
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js').catch(() => {});
</script>
</body>
</html>
